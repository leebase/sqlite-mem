[package]
name = "embed-parity"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# default-features = false keeps the tree pure-Rust (no onig/esaxx C++ deps),
# which is what makes the musl static build viable.
tokenizers = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[features]
default = []
# Embeds granite f16 weights + tokenizer + config directly in the binary.
embed-model = []

[profile.release]
opt-level = 3
