[package]
name = "sqlite-mem"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fully offline, single-file AI memory CLI (save/ask) with a bundled embedding model."

[[bin]]
name = "sqlite-mem"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"

# Embedding runtime. candle 0.9.1 + tokenizers/fancy-regex: pure-Rust tree (no
# onig C dep), parity re-verified vs the S1 reference (all 100 texts >= 0.999).
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
candle-transformers = { version = "=0.9.1", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[features]
default = ["model-sidecar"]
# Real Candle inference; model files loaded from a disk path (dev loop default,
# fast incremental builds -- see src/embed/mod.rs for path resolution).
model-sidecar = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# Real Candle inference; model weights linked into the binary via
# include_bytes! (release builds only -- not exercised by CI).
embed-model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# Deterministic Fixed fake embedder for tests that must run with no network
# and no model weights (Satchel pattern).
test-support = []

[profile.release]
opt-level = 3
