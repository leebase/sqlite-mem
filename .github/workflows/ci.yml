name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every feature combination the product ships must be warning-clean,
      # not just the one CI happens to test against.
      - name: "clippy (default features: model-sidecar)"
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (test-support only, no candle)
        run: cargo clippy --all-targets --no-default-features --features test-support -- -D warnings
      - name: clippy (embed-model)
        run: |
          # clippy is static analysis: build.rs only checks the files exist
          # and include_bytes! embeds them without executing anything, so
          # empty stubs are sufficient (the real model is only needed for
          # release builds; see release.yml). Without this, embed-model
          # clippy fails on any machine lacking the S1 spike model (rc2's
          # CI failure).
          mkdir -p /tmp/stub-model
          touch /tmp/stub-model/model.f16.safetensors /tmp/stub-model/tokenizer.json /tmp/stub-model/config.json
          SQLITE_MEM_EMBED_MODEL_DIR=/tmp/stub-model cargo clippy --no-default-features --features embed-model -- -D warnings

  test:
    name: test (no network, no model weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # test-support swaps in the deterministic Fixed embedder
      # (architecture.md §21; Satchel pattern) so the full suite -- unit,
      # property, and integration tests against the real binary -- runs
      # with neither network access nor the bundled model weights on disk.
      # Real-model tests are marked #[ignore]; run them locally with:
      #   SQLITE_MEM_MODEL_DIR=spike/embed-parity/models/granite \
      #     cargo test --features model-sidecar -- --ignored
      - name: cargo test (no-default-features, test-support)
        run: cargo test --no-default-features --features test-support --all-targets

  network-denylist:
    name: network-denylist gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # architecture.md §20/§24.3: no HTTP/DNS/socket crate may ever appear
      # in the dependency tree. Checked against every feature combination
      # the product ships, over both normal AND build-dependency edges
      # (dev-dependencies such as assert_cmd never end up in a shipped
      # binary, so those are deliberately excluded).
      #
      # S6 audit F3: the previous pattern was dead. `mio(?! )` never matches
      # real `cargo tree` output ("mio v1.0.2" always has a space after
      # "mio"), and `tokio-net` hasn't existed since tokio 0.2 -- so this
      # gate would pass even if `tokio`/`mio`/`socket2` etc. were pulled in
      # directly, and it never looked at build-dependency edges at all. The
      # fix: list exact package names, extracted with `cargo tree --prefix
      # none` (one "name version [annotations]" line per package) piped
      # through `cut -d' ' -f1` to get bare names, then matched with
      # `grep -xE` (whole-line match) against an anchored alternation --
      # every hit is an exact package-name equality, not a substring/regex
      # coincidence.
      - name: denylist gate (cargo tree)
        run: |
          set -euo pipefail
          PATTERN='reqwest|hyper|h2|ureq|curl|isahc|attohttpc|minreq|surf|hf-hub|tokio|tokio-util|mio|socket2|async-std|smol|native-tls|rustls|openssl|quinn|tungstenite|hickory-.*|trust-dns-.*'
          fail=0
          for features in "" "--no-default-features --features test-support" "--no-default-features --features embed-model"; do
            echo "== cargo tree --prefix none -e normal,build $features =="
            names=$(cargo tree --prefix none -e normal,build $features | cut -d' ' -f1 | sort -u)
            if echo "$names" | grep -xE -- "$PATTERN"; then
              echo "::error::network-denylist match above for feature set '$features'"
              fail=1
            else
              echo "clean"
            fi
          done
          exit "$fail"
      # architecture.md §20: "structurally impossible, not just prohibited"
      # -- the dependency-tree gate above only catches a *crate* bringing
      # network capability in; this catches sqlite-mem's own source reaching
      # for std's raw socket APIs directly, which would need no dependency
      # at all.
      - name: no raw socket APIs in source
        run: |
          set -euo pipefail
          ! grep -rnE 'std::net|TcpStream|UdpSocket' src/ build.rs

  cargo-audit:
    name: cargo audit (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      # Default cargo-audit behavior: a known RUSTSEC vulnerability fails
      # the run; an "unmaintained" advisory is reported but does not (S6
      # audit F3 -- deliberately not passing --deny unmaintained/warnings).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
